# Render Blueprint: one free web service and one free PostgreSQL database.
services:
  - type: web
    name: shinobi-quiz-battle-devlou-rens
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm run start:render
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: shinobi-quiz-battle-devlou-rens-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: HUB_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_SCHOOL_ID
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: shinobi-quiz-battle-devlou-rens-db
    plan: free
    region: singapore
    databaseName: shinobi_quiz_battle
    ipAllowList: []
